[advisories]
# Ignore RSA vulnerability that has no available fix
ignore = [
    "RUSTSEC-2023-0071"  # Marvin Attack: potential key recovery through timing sidechannels in rsa crate
]

[licenses]
# Allow common open source licenses
allow = [
    "Apache-2.0",
    "MIT", 
    "ISC",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "CC0-1.0",
    "MPL-2.0",
    "GPL-3.0",
    "GPL-3.0-or-later",
    "LGPL-3.0",
    "LGPL-3.0-or-later"
]

[bans]
# Deny specific crates if needed
deny = []

# Skip certain crates from analysis
skip = []