name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  contracts:
    name: Cross-project contracts
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Validate vendored contract schemas, fixtures, and tech-prefix goldens
      run: python3 contracts/tools/contract_check.py

    - name: Assert vendored contracts match the manifest (no drift from source hub)
      run: python3 contracts/tools/manifest.py --check

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
          - nightly
    continue-on-error: ${{ matrix.rust == 'nightly' }}
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: redfire_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Setup database
      run: |
        PGPASSWORD=postgres psql -h localhost -U postgres -d redfire_test -f migrations/001_initial_schema.sql
      env:
        PGPASSWORD: postgres
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/redfire_test
    
    - name: Check formatting
      run: cargo fmt --all -- --check
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/redfire_test
        SQLX_OFFLINE: true
    
    - name: Run clippy
      run: cargo clippy --lib -p redfire-switch -p redfire-codec-engine -p redfire-sip-stack -- -A unused-imports -A dead-code -A unused-variables -A unused-assignments -A clippy::never_loop -A clippy::manual_clamp
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/redfire_test
        SQLX_OFFLINE: true
    
    - name: Build core libraries
      run: |
        cargo build --verbose -p redfire-codec-engine
        cargo build --verbose -p redfire-sip-stack
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/redfire_test
        SQLX_OFFLINE: true
    
    - name: Build working binaries
      run: |
        cargo build --verbose --bin lcr_cli
        cargo build --verbose --bin lcr_test
        cargo build --verbose --bin lcr_data_loader
        cargo build --verbose --bin simple-b2bua-test
        cargo build --verbose --bin redfire-cli
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/redfire_test
        SQLX_OFFLINE: true
    
    - name: Run available tests
      run: |
        cargo test --verbose --lib
        cargo test --verbose -p redfire-codec-engine
        cargo test --verbose -p redfire-sip-stack
        cargo test --verbose --test integration_tests
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/redfire_test
        SQLX_OFFLINE: true
    
    - name: Test libraries independently
      run: |
        cd redfire-codec-engine && cargo test --all-features
        cd ../redfire-sip-stack && cargo test --all-features
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/redfire_test
        SQLX_OFFLINE: true

  gpu-test:
    name: GPU Tests (CPU Fallback)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: stable
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-gpu-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Test GPU feature compilation (with fallback)
      run: |
        echo "GPU features require hardware - skipping in CI environment"
        # GPU tests would run with actual hardware

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: stable
    
    - name: Install cargo-audit
      run: cargo install cargo-audit
    
    - name: Security audit
      run: cargo audit --ignore RUSTSEC-2023-0071
    
    - name: Check for vulnerable dependencies
      run: cargo audit --ignore RUSTSEC-2023-0071

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: stable
        components: llvm-tools-preview
    
    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov
    
    - name: Generate code coverage
      run: cargo llvm-cov --lib --lcov --output-path lcov.info
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/redfire_test
        SQLX_OFFLINE: true
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: lcov.info
        fail_ci_if_error: true

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build development image
      run: docker build -f Dockerfile.dev -t redfire-switch:dev .
    
    - name: Test Docker container
      run: |
        docker run --rm redfire-switch:dev cargo --version
        docker run --rm redfire-switch:dev rustc --version

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: redfire_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: stable
    
    - name: Install SIPp
      run: |
        sudo apt-get update
        # SIPp is not available in Ubuntu 24.04 repos, build from source
        sudo apt-get install -y cmake libssl-dev libsctp-dev libncurses5-dev
        git clone https://github.com/SIPp/sipp.git
        cd sipp
        cmake . -DUSE_SSL=1 -DUSE_SCTP=1
        make
        sudo make install
    
    - name: Setup database
      run: |
        PGPASSWORD=postgres psql -h localhost -U postgres -d redfire_test -f migrations/001_initial_schema.sql
      env:
        PGPASSWORD: postgres
    
    - name: Build project
      run: cargo build --release
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/redfire_test
        SQLX_OFFLINE: true
    
    - name: Run integration tests
      run: ./test-libraries.sh
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/redfire_test

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: stable
    
    - name: Build documentation
      run: cargo doc --no-default-features --no-deps
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/redfire_test
        SQLX_OFFLINE: true
    
    - name: Check documentation links
      run: cargo doc --no-default-features --no-deps --document-private-items
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/redfire_test
        SQLX_OFFLINE: true