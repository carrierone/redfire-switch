[workspace]
members = [
    ".",
    "redfire-codec-engine",
    "redfire-sip-stack",
    "redfire-sip-stack-minimal",
    "redfire-mcp-server",
]
resolver = "2"

[package]
name = "redfire-switch"
version = "0.1.0"
edition = "2021"
description = "High-performance Class 4 SIP telephone switch with GPU-accelerated codec transcoding"
homepage = "https://redfireswitch.com"
repository = "https://github.com/carrierone/redfire-switch"
license = "GPL-3.0-or-later"
authors = ["Carrier One Inc <info@carrierone.com>"]

[dependencies]
# Local libraries
redfire-codec-engine = { path = "redfire-codec-engine" }
redfire-sip-stack = { path = "redfire-sip-stack" }

# External SIP dependencies
# rsipstack = "0.2"  # Temporarily disabled due to security vulnerabilities
rsip = "0.4"

tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive", "env"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# STIR/SHAKEN dependencies
jsonwebtoken = "9.1"
base64 = "0.21"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
urlencoding = "2.1"
url = "2.5"
dirs = "5.0"
num_cpus = "1.16"
ring = "0.17"
x509-parser = "0.15"
pem = "3.0"

# Database dependencies
sqlx = { version = "0.8.2", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "rust_decimal"] }
deadpool-postgres = "0.11"
tokio-postgres = "0.7"
postgres-types = { version = "0.2", features = ["derive"] }
rust_decimal = "1.33"
rust_decimal_macros = "1.33"

# Phone number validation
rlibphonenumber = "0.2.1"

# Cache and synchronization
dashmap = "5.5"
arc-swap = "1.6"
once_cell = "1.19"

# API and CLI
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
regex = "1.10"
lazy_static = "1.4"
rand = "0.8"
md5 = "0.7"
tempfile = "3.8"
csv = "1.3"
# Interactive CLI dependencies
rustyline = "13.0"
crossterm = "0.27"
tui = "0.19"
winnow = "0.5"
dasp = "0.11"
ipnetwork = "0.20"
ipnet = "2.9"
tokio-rustls = "0.24"
rustls = "0.21"
async-trait = "0.1"
walkdir = "2.4"
colored = "2.1"
termion = "2.0"
parking_lot = "0.12"
bincode = "1.3"
nom = "7.1"
hex = "0.4"
bitflags = "2.4"
bytes = "1.5"
futures = "0.3"
byteorder = "1.5"

# Working binaries only
[[bin]]
name = "simple-b2bua-test"
path = "src/bin/simple_b2bua_test.rs"

[[bin]]
name = "core-test-suite"
path = "src/bin/core_test_suite.rs"

[[bin]]
name = "lcr_cli"
path = "src/bin/lcr_cli.rs"

[[bin]]
name = "lcr_test"
path = "src/bin/lcr_test.rs"

[[bin]]
name = "lcr_data_loader"
path = "src/bin/lcr_data_loader.rs"

[[bin]]
name = "lcr_sip_server"
path = "src/bin/lcr_sip_server.rs"

[[bin]]
name = "comprehensive-demo"
path = "src/bin/comprehensive_demo.rs"

[[bin]]
name = "sipi-automated-tests"
path = "src/bin/sipi_automated_tests.rs"

[[bin]]
name = "enterprise-demo"
path = "src/bin/enterprise_demo.rs"

[[bin]]
name = "ai-analytics-demo"
path = "src/bin/ai_analytics_demo.rs"

[[bin]]
name = "phone-validation-test-suite"
path = "src/bin/phone_validation_test_suite.rs"

[[bin]]
name = "simple-phone-validation-test"
path = "src/bin/simple_phone_validation_test.rs"

[features]
default = []

# GPU acceleration features
cuda = ["redfire-codec-engine/cuda"]
rocm = ["redfire-codec-engine/rocm"]
gpu = ["cuda"]  # Alias for CUDA

# Assembly optimization features
g729_asm = []  # Enable G.729 assembly optimizations

# Audio processing dependencies are now in codec engine

[[bin]]
name = "redfire-cli"
path = "src/bin/redfire_cli.rs"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
