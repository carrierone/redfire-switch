[workspace]
members = [
    ".",
    "redfire-codec-engine",
    "redfire-sip-stack",
    "redfire-sip-stack-minimal",
    "redfire-mcp-server",
]
resolver = "2"

[package]
name = "redfire-switch"
version = "0.1.0"
edition = "2021"
description = "High-performance Class 4 SIP telephone switch with GPU-accelerated codec transcoding"
homepage = "https://redfireswitch.com"
repository = "https://github.com/carrierone/redfire-switch"
license = "GPL-3.0-or-later"
authors = ["Carrier One Inc <info@carrierone.com>"]

[dependencies]
# Local libraries
redfire-codec-engine = { path = "redfire-codec-engine" }
redfire-sip-stack = { path = "redfire-sip-stack" }

# External SIP dependencies
# rsipstack = "0.2"  # Temporarily disabled due to security vulnerabilities
rsip = "0.4"

tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# STIR/SHAKEN dependencies
jsonwebtoken = "9.3"
base64 = "0.22"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"
home = "0.5"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
urlencoding = "2.1"
url = "2.5"
dirs = "5.0"
num_cpus = "1.16"
ring = "0.17"
x509-parser = "0.15"
pem = "3.0"

# Database dependencies
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "sqlite", "chrono", "uuid", "rust_decimal"] }
deadpool-postgres = "0.14"
tokio-postgres = "0.7"
postgres-types = { version = "0.2", features = ["derive"] }
rust_decimal = "1.36"
rust_decimal_macros = "1.36"

# Phone number validation
phonenumber = "0.3.7"

# Cache and synchronization
dashmap = "6.1"
arc-swap = "1.7"
once_cell = "1.20"

# Performance optimizations
crossbeam = "0.8"
crossbeam-channel = "0.5"
crossbeam-skiplist = "0.1"
smallvec = "1.13"
smallstr = "0.3"
string-interner = "0.17"
object-pool = "0.5"
lockfree = "0.5"
flurry = "0.5"
ahash = "0.8"
lru = "0.12"
moka = { version = "0.12", features = ["future"] }

# Networking and TLS (using compatible versions)
rustls-webpki = "0.102"
webpki-roots = "0.26"
rustls-pemfile = "2.1"

# Audio and video codecs (optional, for codec support)
# libsrtp2-sys = "0.3"  # Optional SRTP support
# opus = "0.3"          # Optional Opus codec
# speex-sys = "0.3"     # Optional Speex codec

# Additional utilities
thiserror = "1.0"
derive_more = "0.99"

# API and CLI
axum = { version = "0.7", features = ["ws", "macros"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "timeout", "limit", "fs"] }
utoipa = { version = "5.0", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "8.0", features = ["axum"] }
hyper = { version = "1.5", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }
regex = "1.10"
rand = "0.8"
md5 = "0.7"
tempfile = "3.8"
csv = "1.3"
# Interactive CLI dependencies
rustyline = "13.0"
crossterm = "0.27"
tui = "0.19"
winnow = "0.5"
dasp = "0.11"
ipnetwork = "0.20"
ipnet = "2.9"
tokio-rustls = "0.26"
rustls = "0.23"
async-trait = "0.1"
walkdir = "2.4"
colored = "2.1"
termion = "2.0"
parking_lot = "0.12"
bincode = "1.3"
nom = "7.1"
hex = "0.4"
bitflags = "2.4"
bytes = "1.5"
futures = "0.3"
byteorder = "1.5"

# Working binaries only
[[bin]]
name = "simple-b2bua-test"
path = "src/bin/simple_b2bua_test.rs"

[[bin]]
name = "core-test-suite"
path = "src/bin/core_test_suite.rs"

[[bin]]
name = "lcr_cli"
path = "src/bin/lcr_cli.rs"

[[bin]]
name = "lcr_test"
path = "src/bin/lcr_test.rs"

[[bin]]
name = "lcr_data_loader"
path = "src/bin/lcr_data_loader.rs"

[[bin]]
name = "lcr_sip_server"
path = "src/bin/lcr_sip_server.rs"

[[bin]]
name = "comprehensive-demo"
path = "src/bin/comprehensive_demo.rs"

[[bin]]
name = "sipi-automated-tests"
path = "src/bin/sipi_automated_tests.rs"

[[bin]]
name = "enterprise-demo"
path = "src/bin/enterprise_demo.rs"

[[bin]]
name = "ai-analytics-demo"
path = "src/bin/ai_analytics_demo.rs"

[[bin]]
name = "phone-validation-test-suite"
path = "src/bin/phone_validation_test_suite.rs"

[[bin]]
name = "simple-phone-validation-test"
path = "src/bin/simple_phone_validation_test.rs"

[features]
default = ["database", "services"]

# GPU acceleration features
cuda = ["redfire-codec-engine/cuda"]
rocm = ["redfire-codec-engine/rocm"]
gpu = ["cuda"]  # Alias for CUDA

# Assembly optimization features
g729_asm = []  # Enable G.729 assembly optimizations

# BGP Anycast networking feature
bgp-anycast = []  # Enable BGP anycast routing capabilities

# Database integration
database = []

# Optional services
services = []

# Audio processing dependencies are now in codec engine

[[bin]]
name = "redfire-cli"
path = "src/bin/redfire_cli.rs"

[[bin]]
name = "redfire-web-ui"
path = "src/bin/redfire_web_ui.rs"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
