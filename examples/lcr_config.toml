# LCR Engine Configuration Example
# This file shows comprehensive configuration for the Least Cost Routing engine

[database]
# PostgreSQL connection string
url = "postgresql://lcr_user:lcr_pass@localhost:5432/lcr_db"
# Maximum database connections
max_connections = 20

[api]
# API server bind address
bind_addr = "0.0.0.0:8080"
# Enable API authentication
auth_enabled = false
# API timeout in seconds
timeout = 30

[global_timers]
# Maximum time between 100 Trying and 183 Session Progress (milliseconds)
timer_100_to_183_ms = 30000
# Maximum call duration before forced disconnect (seconds)
timer_max_call_duration_sec = 10800
# Post dial delay (milliseconds)
timer_post_dial_delay_ms = 5000
# Maximum ringing time (seconds)
timer_ringing_timeout_sec = 120
# SIP transaction timeout (milliseconds)
timer_transaction_timeout_ms = 32000

[global_route_advance]
# SIP codes that trigger route advancement to next trunk
advance_on_codes = ["503", "504", "603", "606", "480", "487", "502", "500"]
# SIP codes that stop routing (no more attempts)
stop_on_codes = ["404", "486", "600", "604", "403", "401", "402"]

[cache]
# Enable automatic cache reloading
auto_reload = true
# Cache reload interval in minutes
reload_interval_minutes = 60
# Enable cache statistics
enable_stats = true

[nanpa]
# Path to NANPA data files
data_path = "files/"
# Automatically load NANPA data on startup
auto_load = true
# NANPA data refresh interval (hours)
refresh_interval_hours = 24

[lrn]
# Enable LRN lookups
enabled = true
# LRN cache TTL (hours)
cache_ttl_hours = 24
# LRN lookup timeout (milliseconds)
lookup_timeout_ms = 5000

[cluster]
# Enable cluster synchronization
enabled = false
# Cluster node ID
node_id = "lcr-node-1"
# Cluster discovery method (redis, consul, static)
discovery_method = "static"
# Cluster nodes (for static discovery)
nodes = ["192.168.1.10:8080", "192.168.1.11:8080"]

[monitoring]
# Enable prometheus metrics
prometheus_enabled = true
# Prometheus metrics port
prometheus_port = 9090
# Enable health checks
health_checks = true
# Health check interval (seconds)
health_check_interval = 30

