[package]
name = "redfire-codec-engine"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "High-performance audio codec translation engine with GPU acceleration"
authors = ["Carrier One Inc", "Redfire Switch Contributors"]
repository = "https://github.com/carrierone/redfire-switch"
keywords = ["audio", "codec", "voip", "telecom", "gpu"]
categories = ["multimedia::audio", "network-programming"]

[dependencies]
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
dasp = { version = "0.11", features = ["all"] }
hex = "0.4"

# GPU dependencies (optional)
cudarc = { version = "0.11", optional = true, features = ["driver", "nvrtc"] }
hip_rs = { version = "0.1", optional = true }

# Additional audio processing
uuid = "1.0"

[build-dependencies]
chrono = { version = "0.4", features = ["serde"] }

[features]
default = []
cuda = ["dep:cudarc"]
rocm = ["dep:hip_rs"]
gpu = ["cuda"] # Default GPU backend

[lib]
name = "redfire_codec_engine"
path = "src/lib.rs"

[dev-dependencies]
tokio-test = "0.4"