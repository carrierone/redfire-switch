[global]
type=global
endpoint_identifier_order=ip,username,anonymous

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5062

[transport-tcp]
type=transport  
protocol=tcp
bind=0.0.0.0:5062

; Redfire Switch endpoint for testing
[redfire-switch]
type=endpoint
transport=transport-udp
context=from-redfire
disallow=all
allow=ulaw,alaw,g729,g722,opus
auth=redfire-switch
aors=redfire-switch
direct_media=no
media_address=127.0.0.1
rtp_ipv6=no
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733

[redfire-switch]
type=auth
auth_type=userpass
password=redfire123
username=asterisk-pjsip

[redfire-switch]
type=aor
contact=sip:127.0.0.1:5060
qualify_frequency=30

; Test endpoints for Redfire to call
[test-endpoint-2001]
type=endpoint
transport=transport-udp
context=test-users
disallow=all
allow=ulaw,alaw
auth=test-endpoint-2001
aors=test-endpoint-2001
direct_media=no
dtmf_mode=rfc4733

[test-endpoint-2001]
type=auth
auth_type=userpass
password=test123
username=2001

[test-endpoint-2001]
type=aor
max_contacts=1
qualify_frequency=60

[test-endpoint-2002]
type=endpoint
transport=transport-udp
context=test-users  
disallow=all
allow=ulaw,alaw
auth=test-endpoint-2002
aors=test-endpoint-2002
direct_media=no
dtmf_mode=rfc4733

[test-endpoint-2002]
type=auth
auth_type=userpass
password=test123
username=2002

[test-endpoint-2002]
type=aor
max_contacts=1
qualify_frequency=60

; Trunk configuration for high-volume testing
[redfire-trunk-pjsip]
type=endpoint
transport=transport-udp
context=redfire-trunk
disallow=all
allow=ulaw,alaw,g729,g722
auth=redfire-trunk-pjsip
aors=redfire-trunk-pjsip
direct_media=no
media_address=127.0.0.1
dtmf_mode=rfc4733

[redfire-trunk-pjsip]
type=auth
auth_type=userpass
password=trunk123
username=asterisk-trunk

[redfire-trunk-pjsip]
type=aor
contact=sip:127.0.0.1:5060
qualify_frequency=30

; Registration for tech prefix testing
[redfire-techprefix-reg]
type=registration
transport=transport-udp
outbound_auth=redfire-techprefix-reg
server_uri=sip:127.0.0.1:5060
client_uri=sip:techprefix-test@127.0.0.1:5060
contact_user=techprefix-test

[redfire-techprefix-reg]
type=auth
auth_type=userpass
password=techprefix123
username=techprefix-test