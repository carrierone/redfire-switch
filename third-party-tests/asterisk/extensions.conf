[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
REDFIRE_IP=127.0.0.1
REDFIRE_PORT=5060

; Context for calls from Redfire Switch
[from-redfire]
; Echo test - calls to 999 get echoed back
exten => 999,1,NoOp(Echo test from Redfire)
exten => 999,n,Answer()
exten => 999,n,Wait(1)
exten => 999,n,Echo()
exten => 999,n,Hangup()

; DTMF test - calls to 998 collect DTMF
exten => 998,1,NoOp(DTMF test from Redfire)
exten => 998,n,Answer()
exten => 998,n,Wait(1)
exten => 998,n,Background(demo-congrats)
exten => 998,n,Read(dtmf,beep,10,,,5)
exten => 998,n,SayDigits(${dtmf})
exten => 998,n,Hangup()

; Test users 2001-2002 (ring for 30 seconds)
exten => 2001,1,NoOp(Call to test user 2001)
exten => 2001,n,Dial(PJSIP/test-endpoint-2001,30)
exten => 2001,n,Hangup()

exten => 2002,1,NoOp(Call to test user 2002)
exten => 2002,n,Dial(PJSIP/test-endpoint-2002,30)
exten => 2002,n,Hangup()

; Conference test
exten => 5000,1,NoOp(Conference test)
exten => 5000,n,Answer()
exten => 5000,n,ConfBridge(redfire-test,,,menu)
exten => 5000,n,Hangup()

; Call quality test - answers and plays music
exten => 997,1,NoOp(Call quality test)
exten => 997,n,Answer()
exten => 997,n,Wait(2)
exten => 997,n,MusicOnHold(default,120)
exten => 997,n,Hangup()

; Load test endpoint - immediate answer and hangup
exten => 996,1,NoOp(Load test endpoint)
exten => 996,n,Answer()
exten => 996,n,Wait(5)
exten => 996,n,Hangup()

[test-users]
; Internal test user context
exten => 1001,1,NoOp(Calling test user 1001)
exten => 1001,n,Dial(SIP/test-user-1001,30)
exten => 1001,n,Hangup()

exten => 1002,1,NoOp(Calling test user 1002)
exten => 1002,n,Dial(SIP/test-user-1002,30)
exten => 1002,n,Hangup()

; Call Redfire switch for outbound testing
exten => _1NXXNXXXXXX,1,NoOp(Outbound call to ${EXTEN})
exten => _1NXXNXXXXXX,n,Dial(SIP/redfire-trunk/${EXTEN})
exten => _1NXXNXXXXXX,n,Hangup()

exten => _NXXNXXXXXX,1,NoOp(Outbound call to ${EXTEN})
exten => _NXXNXXXXXX,n,Dial(SIP/redfire-trunk/1${EXTEN})
exten => _NXXNXXXXXX,n,Hangup()

[redfire-trunk]
; Trunk context for calls from Redfire
exten => _X.,1,NoOp(Trunk call from Redfire: ${EXTEN})
exten => _X.,n,Answer()
exten => _X.,n,Wait(1)
exten => _X.,n,Playback(demo-congrats)
exten => _X.,n,Wait(2)
exten => _X.,n,Hangup()

[techprefix-test]
; Tech prefix testing context
exten => _*1001*NXXNXXXXXX,1,NoOp(Tech prefix call: ${EXTEN})
exten => _*1001*NXXNXXXXXX,n,Answer()
exten => _*1001*NXXNXXXXXX,n,Wait(1)
exten => _*1001*NXXNXXXXXX,n,Playback(demo-thanks)
exten => _*1001*NXXNXXXXXX,n,Hangup()

exten => _1001*NXXNXXXXXX,1,NoOp(Tech prefix call: ${EXTEN})
exten => _1001*NXXNXXXXXX,n,Answer()
exten => _1001*NXXNXXXXXX,n,Wait(1)
exten => _1001*NXXNXXXXXX,n,Playback(demo-thanks)
exten => _1001*NXXNXXXXXX,n,Hangup()

; Test codec transcoding by forcing specific codecs
[codec-test]
exten => 8001,1,NoOp(G.711 ulaw test)
exten => 8001,n,Answer()
exten => 8001,n,Set(CHANNEL(codec)=ulaw)
exten => 8001,n,Playback(tt-monkeys)
exten => 8001,n,Hangup()

exten => 8002,1,NoOp(G.711 alaw test)
exten => 8002,n,Answer()
exten => 8002,n,Set(CHANNEL(codec)=alaw)
exten => 8002,n,Playback(tt-monkeys)
exten => 8002,n,Hangup()

exten => 8003,1,NoOp(G.729 test)
exten => 8003,n,Answer()
exten => 8003,n,Set(CHANNEL(codec)=g729)
exten => 8003,n,Playback(tt-monkeys)
exten => 8003,n,Hangup()

; Emergency hangup test
exten => h,1,NoOp(Call hungup - CDR: ${CDR(duration)} seconds)

; Invalid extension handling
exten => i,1,NoOp(Invalid extension: ${INVALID_EXTEN})
exten => i,n,Playback(pbx-invalid)
exten => i,n,Hangup()

; Timeout handling
exten => t,1,NoOp(Timeout in context)
exten => t,n,Playback(vm-goodbye)  
exten => t,n,Hangup()