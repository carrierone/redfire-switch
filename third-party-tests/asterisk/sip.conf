[general]
context=default
allowguest=yes
allowoverlap=no
bindport=5061
bindaddr=0.0.0.0
srvlookup=yes
disallow=all
allow=ulaw
allow=alaw
allow=g729
allow=g722
allow=opus
alwaysauthreject=yes
canreinvite=no
nat=force_rport,comedia
session-timers=refuse

; Test peer for Redfire Switch
[redfire-test]
type=peer
secret=redfire123
host=127.0.0.1
port=5060
context=redfire-test
canreinvite=no
nat=force_rport,comedia
disallow=all
allow=ulaw
allow=alaw
allow=g729
allow=g722
dtmfmode=rfc4733
qualify=yes
insecure=port,invite

; Test user for receiving calls from Redfire
[test-user-1001]
type=peer
secret=test123
host=dynamic
context=test-users
canreinvite=no
disallow=all
allow=ulaw
allow=alaw
dtmfmode=rfc4733

[test-user-1002] 
type=peer
secret=test123
host=dynamic
context=test-users
canreinvite=no
