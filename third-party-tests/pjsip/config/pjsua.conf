# PJSUA Configuration for Redfire Switch Testing

# Network settings
--local-port=5067
--ip-addr=127.0.0.1
--bound-addr=127.0.0.1

# SIP settings
--id=sip:pjsip-test@127.0.0.1:5067
--registrar=sip:127.0.0.1:5060
--username=pjsip-test
--password=pjsip123
--realm=*

# Media settings  
--rtp-port=21000
--quality=10
--ptime=20
--no-vad
--ec-tail=256
--ilbc-mode=20

# Codecs (in preference order)
--add-codec=PCMU/8000/1
--add-codec=PCMA/8000/1
--add-codec=G729/8000/1
--add-codec=G722/16000/1

# Logging
--log-level=4
--app-log-level=4
--log-file=logs/pjsip/pjsua.log

# Other options
--auto-answer=200
--duration=30
--max-calls=10
--thread-cnt=4
--use-ice
--use-turn-server=127.0.0.1:3478
--turn-user=test
--turn-passwd=test123

# Auto registration
--auto-update-nat=1
--disable-stun

# For testing various scenarios
--null-audio
--play-file=sounds/test-audio.wav
--rec-file=recordings/pjsip-recording.wav