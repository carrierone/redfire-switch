# Prometheus Configuration for Anti-Fraud Monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'redfire-antifraud'
    environment: 'production'

# Alert rules
rule_files:
  - /etc/prometheus/alerts/*.yml

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Scrape configurations
scrape_configs:
  # Anti-Fraud Service Metrics
  - job_name: 'antifraud-service'
    static_configs:
      - targets: ['antifraud-service:9090']
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'antifraud-main'

  # Vosk Server Metrics
  - job_name: 'vosk-server'
    static_configs:
      - targets: ['vosk-server:9090']
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'vosk-asr'

  # Batch Worker Metrics
  - job_name: 'antifraud-worker'
    static_configs:
      - targets: ['antifraud-worker:9090']
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'batch-processor'

  # PostgreSQL Exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'antifraud-db'

  # Node Exporter for System Metrics
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: '.*ecpa.*'
        target_label: compliance_metric
        replacement: 'true'
      - source_labels: [__name__]
        regex: '.*fraud.*'
        target_label: fraud_detection
        replacement: 'true'
      - source_labels: [__name__]
        regex: '.*recording.*'
        target_label: sensitive_data
        replacement: 'true'